name: cupola
description: One native client for a self-hosted media stack and the box it runs on.
homepage: https://github.com/matthw-labs/cupola
repository: https://github.com/matthw-labs/cupola
issue_tracker: https://github.com/matthw-labs/cupola/issues

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: 3.47.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  # Promoted from a transitive dependency of `shared_preferences` so the demo
  # (`lib/demo/demo_session.dart`) can hold the app's preferences in memory
  # for as long as it runs.
  shared_preferences_platform_interface: ^2.4.2
  flutter_secure_storage: ^10.2.0
  cached_network_image: ^3.4.1
  # Promoted from a transitive dependency of `cached_network_image` so
  # `lib/core/network/pinned_image_cache.dart` can build a per-origin
  # `CacheManager`/`HttpFileService` pinned to a trusted self-signed
  # certificate (ADR-6), posters from an arr instance behind one would
  # otherwise stay broken even after the API transport is pinned, since
  # `cached_network_image` fetches over its own HTTP stack.
  flutter_cache_manager: ^3.4.1
  # Promoted for the same reason: `HttpFileService` takes a `package:http`
  # `Client`, and `IOClient` is what lets it wrap our pinned `dart:io`
  # `HttpClient`.
  http: ^1.6.0
  # Promoted from Flutter's own dependency, at the version Flutter pins, for
  # the title light: Celebi quantising and HCT, as the brand book derives the
  # room's light from a title's artwork.
  material_color_utilities: ^0.13.0
  # Promoted from a transitive dependency of `flutter_cache_manager`, at the
  # version already resolved, for the Home's last known state: the system's
  # cache folder, where a file that may be purged and is never backed up
  # belongs (`lib/core/last_known/last_known_store.dart`).
  path_provider: ^2.1.5
  # The QR of an invite: encoding only, pure Dart. The code is
  # drawn by Cupola's own painter (`lib/core/widgets/qr_code_view.dart`).
  qr: ^3.0.2
  infinite_scroll_pagination: ^5.1.1
  url_launcher: ^6.3.2
  # The tip jar is App Store only (`DonationService.usesIAP`), so Cupola takes
  # the StoreKit half of in_app_purchase and not the umbrella: the umbrella
  # pulls in_app_purchase_android, whose Play Billing library and BILLING
  # permission would ship in every Android build for a flow Android never runs.
  in_app_purchase_platform_interface: ^1.4.0
  in_app_purchase_storekit: ^0.4.8+1
  file_picker: ^8.1.4
  socket_io_client: ^3.1.0
  # Referenced directly for the custom WebSocket connector that pins a trusted
  # self-signed certificate on the Dockge Socket.IO connection.
  web_socket: ^1.0.1
  # Carries one long-running release search across app suspension on iOS and
  # Android. Its `DataTask` is routed onto a real background `URLSession`, which
  # is what lets a multi-minute request survive being backgrounded, and needs no
  # `UIBackgroundModes`, so there is nothing to justify at App Store review. Two
  # of its defaults are actively wrong for this use and are overridden at startup
  # in `main.dart`: `requestTimeout` (60s "waiting for more data", and our server
  # sends nothing for minutes) and `doRescheduleKilledTasks` (would silently
  # re-run a killed search against the user's indexers).
  background_downloader: ^9.5.7
  # Tells the user a background search finished. Only `POST_NOTIFICATIONS` is
  # required, because `zonedSchedule` is never called, which is what keeps this
  # clear of the Play-restricted exact-alarm permissions.
  flutter_local_notifications: ^22.2.0
  # Runs the widgets' and notifications' read with the app off the screen:
  # Android's WorkManager every 15 minutes with a network, iOS's
  # BGAppRefreshTask when the system allows.
  # Pinned to an exact version: pre-1.0, and it reaches into both platforms'
  # schedulers. Its two foreground-service permissions are removed in
  # `AndroidManifest.xml`, since no task here runs as one.
  workmanager: 0.10.10
  # The channel `cupola/outside` on Android (`outside_native.dart`), a local
  # plugin and not a channel in MainActivity: the background read runs in an
  # engine of WorkManager's own, which registers only the plugins of the
  # generated registrant, so a channel on the activity's engine would not
  # exist there and the reload that ends a run would be lost. Android only;
  # iOS answers the same channel in `ios/Runner/AppDelegate.swift`.
  outside_channel:
    path: packages/outside_channel
  # SHA-256 fingerprints for trust-on-first-use TLS certificate pinning.
  crypto: ^3.0.0
  # The package another device copies its connections from: encrypted with
  # AES-256-GCM under an HKDF key, the pure Dart part only (no `cryptography_flutter`).
  cryptography: ^2.9.0
  # Grapheme-slot text rolling, used only where a *changing* value is the
  # information: live figures, state words, command labels. Pure Dart, no
  # platform channels, no transitive dependencies; see `lib/core/reel_motion.dart`
  # for the one place its timing is chosen.
  #
  # Pinned to an exact version on purpose. It is pre-1.0 with a single
  # maintainer, and it reaches into `TextPainter`, dry layout and baseline
  # metrics, the part of Flutter most likely to move under it. A caret here
  # would let a patch release change text layout across the app unreviewed.
  reel_text: 0.4.3

  # Desktop window chrome. The app draws its own 44px top strip on macOS,
  # Windows and Linux, so it needs the window itself to stop drawing one: this
  # is the only package that can hide a title bar while keeping the macOS
  # traffic lights, which the design requires inset over our strip rather than
  # replaced by lookalikes. Desktop-only by construction: every call site is
  # behind `DesktopWindow.isSupported`, so the mobile builds never touch it.
  window_manager: ^0.5.0
  material_symbols_icons: ^4.2960.0

  # Reads the other device's code in Copy from another device, on iOS and
  # Android only: a computer pastes the link. It asks for the camera itself.
  mobile_scanner: ^7.4.2

  # The device's IANA time zone (`Europe/Rome`), which Tracearr cuts its Today
  # at. Dart names the zone only by its abbreviation (`CET`), and Tracearr
  # reads a day without one from UTC midnight. Read in one place,
  # `lib/core/platform/device_time_zone.dart`, and a zone it cannot give is
  # simply not sent.
  flutter_timezone: ^5.1.1

dependency_overrides:
  # path_provider_foundation 2.6.0 pulls in objective_c native assets,
  # which currently breaks iOS release install/signing on device.
  path_provider_foundation: 2.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # The design catalog (test/design_catalog/) hands local artwork to the image
  # cache, whose FileInfo is typed on package:file.
  file: ^7.0.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Keep the existing CocoaPods runners while upgrading the Flutter SDK.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # The three families of the type system, each a single variable file (see
    # `AppTheme`: every role sets its axes explicitly, because a variable face
    # registered once renders at its default instance whatever `fontWeight`
    # asks for). Bricolage Grotesque (opsz, wdth, wght) sets display type,
    # Onest (wght) sets text, Geist Mono (wght) sets machine strings.
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
    # One mark per service, built from `tool/service_glyphs/` by its
    # `build_font.py`. Generated: rebuild it rather than editing the file.
    - family: CupolaServices
      fonts:
        - asset: assets/fonts/CupolaServices.otf

  assets:
    # The product mark: the Cupola seen from above, with six lit window panes on the
    # hexagon's edge midpoints, around the central circular window. Rendered from
    # `assets/brand/cupola_mark.svg`, which is the vector source of record.
    - assets/brand/cupola_mark.png
    # The three families ship under the SIL OFL 1.1, whose clause 2 requires the
    # licence to travel with the font. Bundled so `main.dart` can hand each one
    # to `LicenseRegistry`, which is what puts them in the app's own licence
    # page.
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/Onest-OFL.txt
    - assets/fonts/GeistMono-OFL.txt
    # The demo's posters and backdrops, the Blender Studio's own pictures of
    # its open films (CC BY 4.0): `lib/demo/world/artwork.dart`.
    - assets/demo/artwork/
    # The recorded answers the demo world serves as they are
    # (`lib/demo/world/fixtures.dart`). They keep their one home beside the
    # model tests that read them; every file the world names is listed here,
    # held by `test/demo/world_fixtures_guard_test.dart`.
    - test/fixtures/emby/system_info.json
    - test/fixtures/emby/system_info_public.json
    - test/fixtures/jellyfin/system_info_public.json
    - test/fixtures/npm/users_me_admin.json
    - test/fixtures/npm/users_me_view_only.json
    - test/fixtures/nzbget/status.json
    - test/fixtures/nzbget/version.json
    - test/fixtures/plex/capabilities.json
    - test/fixtures/plex/identity.json
    - test/fixtures/plex/library_sections.json
    - test/fixtures/sabnzbd/server_stats.json
    - test/fixtures/tracearr/real_health.json
    - test/fixtures/tracearr/real_history.json
    - test/fixtures/tracearr/real_servers.json
    - test/fixtures/tracearr/real_streams_live.json
    - test/fixtures/tracearr/real_today.json
    - test/fixtures/seerr/public_settings_jellyseerr_1.9.2.json
    - test/fixtures/seerr/public_settings_jellyseerr_2.7.3.json
    - test/fixtures/seerr/public_settings_overseerr_1.35.0.json
    - test/fixtures/seerr/public_settings_seerr_3.5.0.json
    - test/fixtures/truenas/auth_me_full_admin.json
    - test/fixtures/truenas/auth_me_readonly_admin.json
    - test/fixtures/truenas/rpc_error_eacces.json
    - test/fixtures/unraid/array.json
    - test/fixtures/unraid/docker.json
    - test/fixtures/unraid/error_forbidden.json
    - test/fixtures/unraid/error_unauthenticated.json
    - test/fixtures/unraid/info.json
    - test/fixtures/unraid/me_admin.json
    - test/fixtures/unraid/me_viewer.json

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
