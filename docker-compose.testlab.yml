# Full macOS/OrbStack laboratory for Cupola.
#
# The host application talks to 127.0.0.1. Every bind mount and port in this
# file is disposable and local to the current run. Keep the state directory
# under .ai/scratch/zz_testlab (or pass CUPOLA_TESTLAB_STATE_DIR explicitly).
#
# Start the complete lab with:
#   docker compose -p "${CUPOLA_TESTLAB_PROJECT:-cupola-testlab}" \
#     -f docker-compose.testlab.yml \
#     --profile core --profile downloads --profile media --profile infra \
#     --profile protocol-mocks up -d --wait
#
# The TrueNAS mock serves TLS and needs its self-signed certificate in the state
# directory first: test/e2e/testlab/bootstrap.sh makes it, or run
# test/e2e/testlab/truenas_cert.sh on its own.
services:
  seerr:
    # Seerr v3.4.1, linux/arm64 manifest pinned for a reproducible lab.
    image: ghcr.io/seerr-team/seerr@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    profiles: [core, media]
    environment:
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/seerr:/app/config"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  seerr-sara:
    # The friend's Seerr, for P9: the same build as the household's above, on
    # its own port and its own disposable state. Its admin is a Jellyfin user
    # of this lab, and the operator holds a local account on it that may only
    # request. test/e2e/testlab/seerr_sara.py sets it up and seeds it.
    image: ghcr.io/seerr-team/seerr@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    profiles: [core]
    environment:
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "127.0.0.1:5056:5055"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/seerr-sara:/app/config"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  radarr:
    # Radarr 5.27.5.10198-ls285.
    image: lscr.io/linuxserver/radarr@sha256:af03fa6a993ee7efb65f6121ebd8c89de4a47aa1181cec03832e292a1446111f
    profiles: [core, media]
    environment: &linuxserver-env
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/radarr:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-Api-Key: test-key' http://127.0.0.1:7878/api/v3/system/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sonarr:
    # Sonarr 4.0.15.2941-ls296.
    image: lscr.io/linuxserver/sonarr@sha256:fbe67c25693dc5f3de220c5691f374576ae265df782c16918cc071b630490bd7
    profiles: [core, media]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/sonarr:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-Api-Key: test-key' http://127.0.0.1:8989/api/v3/system/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  lidarr:
    # Lidarr 3.1.0.4875-ls41.
    image: lscr.io/linuxserver/lidarr@sha256:8ab0fd370b604ae034d9a9c261a9d8d873bece33d9736852e7ce4f3566e4a35d
    profiles: [core, media]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/lidarr:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-Api-Key: test-key' http://127.0.0.1:8686/api/v1/system/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  readarr:
    # Readarr develop 0.4.18.2805-ls157.
    image: ghcr.io/linuxserver/readarr@sha256:baf471a7101b58f361ef960de91cd15f23bae82d0126df6a9edbeaf5c5aa4392
    profiles: [core, media]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/readarr:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-Api-Key: test-key' http://127.0.0.1:8787/api/v1/system/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prowlarr:
    # Prowlarr 2.3.0.5236-ls140.
    image: lscr.io/linuxserver/prowlarr@sha256:e50f3b188a7d1771b61f395c4203e35476bd3047683508740305e830e15bacf7
    profiles: [core, downloads]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/prowlarr:/config"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-Api-Key: test-key' http://127.0.0.1:9696/api/v1/system/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bazarr:
    # Bazarr 1.5.2-ls318.
    image: lscr.io/linuxserver/bazarr@sha256:e1f05f60dada5f7bc83c52037e222a34c26ad04339c22ea685de680ddcd58487
    profiles: [core, media]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:6767:6767"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/bazarr:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -H 'X-API-KEY: test-key' http://127.0.0.1:6767/api/badges >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qbittorrent:
    # qBittorrent 5.1.2-r4-ls426.
    image: lscr.io/linuxserver/qbittorrent@sha256:7034f73a3c6fa4ea40fd67df462939d1665d765231b572523921c98c2db5362e
    profiles: [core, downloads]
    depends_on:
      testlab-indexer:
        condition: service_healthy
    environment: *linuxserver-env
    ports:
      # qBittorrent 5.1 validates the Host and Origin port of a request against
      # its own WebUI port (8080). The app reaches it through the fault layer on
      # 8080 (see toxiproxy below), so its requests carry the port qBittorrent
      # expects. The lab's own readings go straight to this container on 18080
      # and send that Host explicitly (seed_lab, queue_probe).
      - "127.0.0.1:18080:8080"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/qbittorrent:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qbittorrent-seed:
    # The local seeder. Its data lives outside the app client's downloads, so
    # the app's qBittorrent really fetches the release over BitTorrent.
    image: lscr.io/linuxserver/qbittorrent@sha256:7034f73a3c6fa4ea40fd67df462939d1665d765231b572523921c98c2db5362e
    profiles: [core, downloads]
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: "8081"
    depends_on:
      testlab-indexer:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/qbittorrent-seed:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/seed-data:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8081 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  transmission:
    # Transmission 4.1.3-r0-ls362.
    image: lscr.io/linuxserver/transmission@sha256:1a12fef3c89eca48b7be9e7d36b17b4eb4e1bcf5e1ee7fbf372e3a38b562939d
    profiles: [core, downloads]
    environment:
      <<: *linuxserver-env
      # LinuxServer's image consumes USER/PASS, not TRANSMISSION_RPC_*.
      USER: transmission
      PASS: transmission
      WHITELIST: ""
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/transmission:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "auth=$$(printf '%s:%s' \"$$USER\" \"$$PASS\" | base64); code=$$(curl -sS -o /dev/null -w '%{http_code}' -H \"Authorization: Basic $$auth\" -X POST http://127.0.0.1:9091/transmission/rpc); test \"$$code\" = 200 || test \"$$code\" = 409"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sabnzbd:
    # SABnzbd 5.1.3-ls273.
    image: lscr.io/linuxserver/sabnzbd@sha256:948ea3dc45d68943ec14b33ba37ffa1488da3e9837bf3ca0f75621e971614d85
    profiles: [core, downloads]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/sabnzbd:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://127.0.0.1:8080/api?mode=version&output=json&apikey=test-key' >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  nzbget:
    # NZBGet v26.3-ls263.
    image: lscr.io/linuxserver/nzbget@sha256:24951ff9689ddbc0843e309ed16db74409a077541a8aeaecca606ae3565768f2
    profiles: [core, downloads]
    environment:
      <<: *linuxserver-env
      NZBGET_USER: nzbget
      NZBGET_PASS: tegbzn6789
    ports:
      - "127.0.0.1:6789:6789"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/nzbget:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    healthcheck:
      test: [CMD-SHELL, "auth=$$(printf '%s:%s' \"$$NZBGET_USER\" \"$$NZBGET_PASS\" | base64); curl -fsS -H \"Authorization: Basic $$auth\" http://127.0.0.1:6789/jsonrpc >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  jellyfin:
    # Jellyfin 12.1ubu2604-ls50 (server 12.1.0).
    image: lscr.io/linuxserver/jellyfin@sha256:51252e7a416e703cdc3cd91e8a54673a2430cc80409be8a38abe511411577b95
    profiles: [core, media]
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/jellyfin:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media:ro"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  emby:
    # Emby Server 4.10.2.0, the free edition: nothing the app calls asks for
    # Premiere. The tag and the index digest are what `emby/embyserver:latest`
    # was on 2026-11-06, linux/arm64 included. Emby's own image reads UID, GID
    # and GIDLIST (the linuxserver PUID/PGID of the others means nothing to it).
    # It listens on 8096 like Jellyfin, so the host publishes it on 8097.
    image: emby/embyserver:4.10.2.0@sha256:7082c63b10a2fcb3805a7eaebba407d5723bc57c085c9f0b29b7d0a702765cc1
    profiles: [core, media]
    environment:
      UID: 1000
      GID: 1000
      GIDLIST: 1000
    ports:
      - "127.0.0.1:8097:8096"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/emby:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media:ro"
    healthcheck:
      # Unauthenticated, and the one route that answers before the first-run
      # wizard has been walked. The image ships wget and no curl.
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8096/emby/System/Info/Public || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  plex:
    # Plex 1.43.4.10903-e5521bd8c-ls324.
    image: lscr.io/linuxserver/plex@sha256:1f6f97d76e7bdb013789e94c838f2d9133b01ee4b2d4194148e492c4e4f12d90
    profiles: [core, media]
    environment:
      <<: *linuxserver-env
      VERSION: docker
    ports:
      - "127.0.0.1:32400:32400"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/plex:/config"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/media:/media:ro"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:32400/identity >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  docker-dind:
    # Docker in Docker, isolated: Dockge gets a daemon of its own and never
    # OrbStack's socket. Privileged by design; it publishes no port to the host
    # and only Dockge reaches it, over this compose network.
    image: docker:dind@sha256:ba3d67c44952ffc448696659a36ef91dd813f03a9c70a2bc0ad1d286d542f4fb
    profiles: [core, infra]
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      # A named volume, not a bind mount: overlayfs inside the dind cannot
      # write its upperdir on the Mac's virtiofs, and every `docker run` then
      # fails with "mount callback failed ... read-only file system". Named
      # volumes live in the Docker VM, where overlayfs works. The snapshots
      # already skip the dind, so nothing is lost by leaving it out of state.
      - cupola-dind:/var/lib/docker
    healthcheck:
      test: [CMD-SHELL, "docker info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  dockge:
    # Dockge 1.5.0.
    image: louislam/dockge@sha256:335c6368b880ecc203236ed89e6e5232e0d6578e8ef5920e4a502390451502bf
    profiles: [core, infra]
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
      DOCKER_HOST: tcp://docker-dind:2375
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      docker-dind:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/dockge:/app/data"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/stacks:/opt/stacks"
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:5001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  nginx-proxy-manager:
    # Nginx Proxy Manager 2.12.3.
    image: jc21/nginx-proxy-manager@sha256:e5eecad9bf040f1e7ddc9db6bbc812d690503aa119005e3aa0c24803746b49ea
    profiles: [core, infra]
    environment:
      TZ: ${TZ:-Europe/Rome}
      DISABLE_IPV6: "true"
    ports:
      - "127.0.0.1:8181:81"
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/npm/data:/data"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/npm/letsencrypt:/etc/letsencrypt"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:81/api/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  truenas-mock:
    build:
      context: test/e2e/testlab/mock
    profiles: [core, infra, protocol-mocks]
    environment:
      MOCK_MODE: truenas
      MOCK_API_KEY: test-key
      MOCK_TLS_CERT: /certs/truenas.crt
      MOCK_TLS_KEY: /certs/truenas.key
    volumes:
      # The self-signed certificate test/e2e/testlab/truenas_cert.sh makes: the
      # app refuses a TrueNAS that is not https://. A directory, not two files,
      # so a certificate made again replaces what the mock reads.
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/truenas:/certs:ro"
    ports:
      - "127.0.0.1:8460:8460"
    healthcheck:
      test: [CMD, python3, /app/server.py, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20

  unraid-mock:
    # Its own build context, not the shared protocol mocks: Unraid is the one
    # simulator whose answers depend on the answer before them, so it keeps a
    # world (`test/e2e/testlab/mock_unraid/server.py`) instead of a reading.
    build:
      context: test/e2e/testlab/mock_unraid
    profiles: [core, infra, protocol-mocks]
    environment:
      MOCK_MODE: unraid
      MOCK_API_KEY: test-key
    ports:
      - "127.0.0.1:8480:8480"
    healthcheck:
      test: [CMD-SHELL, "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8480/graphql\", timeout=1)' "]
      interval: 5s
      timeout: 5s
      retries: 20

  testlab-forge:
    # One synthetic release: a real MKV and a private torrent. It runs once,
    # through `docker compose run`, before the seed; it is not part of `up`.
    build:
      context: test/e2e/testlab/forge
    profiles: [forge]
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/forge:/forge"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/seed-data:/seed-data"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/downloads:/downloads"
    command:
      - --output-dir=/forge
      - --seed-dir=/seed-data
      - --tracker-url=http://testlab-indexer:8088/announce

  testlab-indexer:
    build:
      context: test/e2e/testlab/mock
    profiles: [core, downloads]
    environment:
      MOCK_MODE: indexer
      MOCK_FORGE_DIR: /forge
    ports:
      - "127.0.0.1:8188:8088"
    volumes:
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/forge:/forge:ro"
    healthcheck:
      test: [CMD-SHELL, "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8088/healthz\", timeout=1)'"]
      interval: 5s
      timeout: 5s
      retries: 20

  toxiproxy:
    # Toxiproxy 2.12.0. The app reaches services through these ports; the
    # direct ports stay for the transport harness, which must not depend on the
    # fault layer. Proxies are created by testlab.py proxies/up, not here.
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [core, infra, faults]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:25001:25001"
      - "127.0.0.1:25055:25055"
      - "127.0.0.1:23240:23240"
      - "127.0.0.1:26767:26767"
      - "127.0.0.1:26789:26789"
      - "127.0.0.1:27878:27878"
      # The away addresses: a second listener on the same upstream, switched
      # off on its own. Every service P7 reaches away from home is published,
      # not only the one the `away-home` scenario happens to name, or the
      # profile would carry addresses the host cannot reach.
      - "127.0.0.1:25056:25056"  # Seerr
      - "127.0.0.1:27879:27879"  # Radarr
      - "127.0.0.1:28081:28081"  # qBittorrent
      - "127.0.0.1:28097:28097"  # Jellyfin
      - "127.0.0.1:28099:28099"  # Emby
      - "127.0.0.1:26768:26768"  # Bazarr
      - "127.0.0.1:28990:28990"  # Sonarr
      - "127.0.0.1:8080:8080"  # qBittorrent, on its WebUI port (see the client)
      - "127.0.0.1:28082:28082"
      - "127.0.0.1:28096:28096"
      - "127.0.0.1:28098:28098"
      - "127.0.0.1:28181:28181"
      - "127.0.0.1:28460:28460"
      - "127.0.0.1:28480:28480"
      - "127.0.0.1:28686:28686"
      - "127.0.0.1:28787:28787"
      - "127.0.0.1:28989:28989"
      - "127.0.0.1:29091:29091"
      - "127.0.0.1:29696:29696"

  caddy:
    # The lab's edge: three origins, each with a certificate of its own, issued
    # by Caddy's internal CA. The edge is the one service the lab starts on
    # demand (the `caddy-edge` scenario), so the rest of the lab never pays for
    # it and the certificates it holds can be thrown away and made again at
    # will. The configuration is written by test/e2e/testlab/caddy_lab.py into
    # the lab's state, never kept in the repository. Its own profile needs the
    # lab's: it stands in front of services that live in theirs.
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    profiles: [edge]
    depends_on:
      radarr:
        condition: service_healthy
      dockge:
        condition: service_healthy
      truenas-mock:
        condition: service_healthy
    ports:
      # One port per origin: the app pins a host, a port and a fingerprint, so
      # three origins need three addresses of their own. 8444 belongs to the
      # L10c edge (a process of the host), hence the block starts one above it.
      - "127.0.0.1:8445:8445"
      - "127.0.0.1:8446:8446"
      - "127.0.0.1:8447:8447"
    volumes:
      # The configuration the lab writes, and the CA that issues: both in the
      # lab's state, and the CA's files are Caddy's own 0600.
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/caddy:/etc/caddy:ro"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/caddy/data:/data"
      - "${CUPOLA_TESTLAB_STATE_DIR:-.ai/scratch/zz_testlab/state}/caddy/config:/config"
    healthcheck:
      # The name is what the client sends as SNI, and the certificate belongs
      # to it: the edge answers on that name only.
      test: ["CMD-SHELL", "curl -skf --resolve radarr.localhost:8445:127.0.0.1 -o /dev/null https://radarr.localhost:8445/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  # The dind's own disk. Named so overlayfs can write; not part of the lab's
  # state directory, and the snapshots already ignore the dind.
  cupola-dind:
