name: Desktop builds

# Windows and Linux build only on their own host, so they are built here.
# Run it by hand from the Actions tab, or push a version tag: a tag also
# attaches both archives to a draft release of the same name. A tag with a
# suffix (`v1.1.0-beta`) makes that draft a prerelease. The suffix is
# kAppPrerelease in lib/core/app_identity.dart: pubspec.yaml keeps `1.1.0`,
# because App Store Connect refuses a version that is not three numbers.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the release job, below, gets write.
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.label.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # scripts/release_label.sh names the release (pubspec.yaml plus
      # kAppPrerelease). A tag that names another one fails here, before two
      # hosts build an app that calls itself something else.
      - name: Release label
        id: label
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release=$(scripts/release_label.sh)
          if [[ "$REF_TYPE" == "tag" && "${REF_NAME#v}" != "$release" ]]; then
            echo "::error::Tag $REF_NAME does not name this tree, which is $release (pubspec.yaml and kAppPrerelease)"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux:
    needs: label
    # The oldest supported runner, so the binary loads on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package
        id: package
        env:
          RELEASE: ${{ needs.label.outputs.release }}
        run: |
          archive="cupola-${RELEASE}-linux-x64.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cupola-linux-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  windows:
    needs: label
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Package
        id: package
        shell: pwsh
        env:
          RELEASE: ${{ needs.label.outputs.release }}
        run: |
          $archive = "cupola-$env:RELEASE-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $archive
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cupola-windows-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: archives
          merge-multiple: true

      # A digest is the one thing a reader can check without trusting this
      # page. This one covers the two archives built here; the packages built
      # on the Mac join the draft through scripts/release_attach.sh, which
      # rewrites SHA256SUMS over every file the release carries.
      - name: Checksums
        run: cd archives && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: archives/*
